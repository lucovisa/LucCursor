<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LucCursor</title>
  <meta name="description" content="Create custom Windows cursors right in your browser. Draw pixel-art cursors and export as installable pack.">
  <link rel="icon" href="assets/icons/favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <meta property="og:type" content="website">
  <meta property="og:title" content="LucCursor">
  <meta property="og:description" content="Create custom Windows cursors right in your browser.">
  <meta property="og:image" content="https://lucovisa.github.io/luccursor/assets/gallery/preview.png">
  <meta property="og:url" content="https://lucovisa.github.io/luccursor/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LucCursor">
  <meta name="twitter:description" content="Create custom Windows cursors right in your browser.">
  <meta name="twitter:image" content="https://lucovisa.github.io/luccursor/assets/gallery/preview.png">
</head>
<body class="dark">
  <button id="themeToggle" class="theme-toggle">🌙</button>
  <button id="donateBtn" class="donate-btn">❤️ Donate</button>
  <div id="donateMenu" class="donate-menu hidden">
    <p>Please support an independent author</p>
    <div class="wallet">
      <span>ETH/USDT (ERC-20)</span>
      <span class="address">0xFa78966938743C9168abFC2acD6D7751d7dA35Cf</span>
      <button class="copy-btn" data-address="0xFa78966938743C9168abFC2acD6D7751d7dA35Cf">Copy</button>
    </div>
    <div class="wallet">
      <span>BTC (Bitcoin mainnet)</span>
      <span class="address">bc1q60tvcsw4guyhxa5e3n47eqmj0s3lpxzkxldpvp</span>
      <button class="copy-btn" data-address="bc1q60tvcsw4guyhxa5e3n47eqmj0s3lpxzkxldpvp">Copy</button>
    </div>
    <div class="wallet">
      <span>TON/USDT (The Open Network)</span>
      <span class="address">UQDsZ_8MkBtjjp-pVa5Fefdg1jtJApOZ7oeFF3WBlLnwQcHF</span>
      <button class="copy-btn" data-address="UQDsZ_8MkBtjjp-pVa5Fefdg1jtJApOZ7oeFF3WBlLnwQcHF">Copy</button>
    </div>
  </div>

  <header>
    <h1>LucCursor</h1>
    <p>Draw your own Windows cursors</p>
  </header>

  <main>
    <section class="editor">
      <div class="toolbar">
        <button id="clearBtn">Clear</button>
        <input type="color" id="colorPicker" value="#000000">
      </div>
      <div class="canvas-wrapper">
        <canvas id="pixelCanvas" width="32" height="32"></canvas>
      </div>
      <div class="info">
        <span>Size: 32×32</span>
        <span id="currentType"></span>
      </div>
      <div id="stepButtons" class="step-buttons">
        <button id="skipBtn">Skip</button>
        <button id="continueBtn" disabled>Continue</button>
      </div>
      <button id="downloadBtn" class="hidden">Download ZIP</button>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="js/cursor-types.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
